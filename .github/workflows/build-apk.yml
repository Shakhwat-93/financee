name: Build Android APK & OTA Update

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build OTA Bundle & Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle Cache & Environment
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets & Sync Capacitor
        env:
          APP_VERSION: 1.0.${{ github.run_number }}
        run: npm run cap:sync

      - name: Package OTA Web Bundle (www.zip)
        run: |
          mkdir -p build-output
          (cd www && zip -r ../build-output/www.zip .)

      - name: Publish OTA Live Update (ota-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ota-latest
          name: 1.0.${{ github.run_number }}
          body: ${{ github.event.head_commit.message || 'Latest in-app update' }}
          files: build-output/www.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK for Easy Identification
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/HisabKhata.apk

      - name: Upload APK Artifact (Direct Download Link)
        uses: actions/upload-artifact@v4
        with:
          name: HisabKhata-Android-APK
          path: build-output/HisabKhata.apk
          retention-days: 30
